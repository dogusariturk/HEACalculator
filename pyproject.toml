[project]
name = "HEACalculator"
version = "2.0.0"
description = "A Python tool for calculating phenomenological parameters to predict solid solution formation in High Entropy Alloys (HEAs)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "Doguhan Sariturk", email = "dogu.sariturk@gmail.com" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
    "Programming Language :: Python",
]
dependencies = [
    "numpy>=1.23.4",
    "pandas>=1.4.1",
    "typer>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
gui = ["PyQt6>=6.0.0"]
docs = [
    "mkdocs-material==9.7.4",
    "mkdocstrings[python]==1.0.3",
]

[project.urls]
Home-page = "https://github.com/dogusariturk/HEACalculator/"
Issues = "https://github.com/dogusariturk/HEACalculator/issues"
Repository = "https://github.com/dogusariturk/HEACalculator.git"

[project.scripts]
HEACalculator = "HEACalculator.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/HEACalculator"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.0",
    "prek>=0.3.4",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
    "ty>=0.0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/HEACalculator"]
omit = [
    "src/HEACalculator/app.py",
    "src/HEACalculator/gui/*",
]

[tool.coverage.report]
omit = [
    "src/HEACalculator/app.py",
    "src/HEACalculator/gui/*",
]

[tool.ruff]
line-length = 130
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D", # pydocstyle
    "E", # pycodestyle Errors
    "ERA", # Eradicate
    "F", # Pyflakes
    "FA",  # flake8-future-annotations
    "I", # isort
    "ICN", # flake8-import-conventions
    "N", # pep8-naming
    "PL",  # Pylint
    "PTH", # flake8-use-pathlib
    "Q", # flake8-quotes
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "UP",  # pyupgrade
    "W", # pycodestyle Warnings
]
ignore = [
    "D403", # First word of the docstring should be capitalized
    "E402", # module level import not at top of file
    "E501", # line-too-long
    "N802", # function name should be lowercase
    "N803", # argument name should be lowercase
    "N806", # variable in function should be lowercase
    "N815", # mixedCase variable in class scope
    "N999", # invalid-module-name
    "PLC0415", # `import` should be at the top-level of a file
    "PLR0912", # too-many-branches in complex functions
    "PLR0913", # too-many-arguments in function definition
    "PLR2004", # magic value used in comparison
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/HEACalculator/gui/*.py" = ["ALL"]
"src/HEACalculator/app.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.src]
include = [
    "src",
    "tests",
]
exclude = [
    "src/HEACalculator/gui/*",
    "src/HEACalculator/app.py",
    "tests/test_app.py"
]
